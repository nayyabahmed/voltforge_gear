<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="860" viewBox="0 0 1800 860" role="img" aria-labelledby="figure-title figure-desc">
  <title id="figure-title">Figure 1.4.A — Five ways to load a part</title>
  <desc id="figure-desc">Five diagrams show tension, compression, bending, shear and torsion using force arrows on simple bars. Everyday examples below them are a rope, chair leg, ruler, scissors and towel.</desc>

  <defs>
    <marker id="arrow-orange" markerWidth="22" markerHeight="22" refX="19" refY="11" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 22 11 L 0 22 z" fill="#F26B38"/>
    </marker>
    <marker id="arrow-blue" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 18 9 L 0 18 z" fill="#176B87"/>
    </marker>
    <pattern id="steel-hatch" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(28)">
      <rect width="14" height="14" fill="#DCE3E6"/>
      <line x1="0" y1="0" x2="0" y2="14" stroke="#B5C0C6" stroke-width="4"/>
    </pattern>
    <pattern id="compression-hatch" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M 2 2 L 10 6 L 2 10" fill="none" stroke="#F26B38" stroke-width="2.5"/>
    </pattern>
    <style>
      .panel { fill: #FFFFFF; stroke: #C6D0D5; stroke-width: 2.5; }
      .panel-band { fill: #EAF4F7; }
      .heading { font: 700 31px 'Arial', 'Helvetica', sans-serif; fill: #173E4E; text-anchor: middle; }
      .subhead { font: 700 20px 'Arial', 'Helvetica', sans-serif; fill: #21313B; text-anchor: middle; }
      .small { font: 600 17px 'Arial', 'Helvetica', sans-serif; fill: #41515A; }
      .action { font: 700 17px 'Arial', 'Helvetica', sans-serif; fill: #A83C18; text-anchor: middle; }
      .part { fill: url(#steel-hatch); stroke: #21313B; stroke-width: 4; stroke-linejoin: round; }
      .part-line { fill: none; stroke: #21313B; stroke-width: 25; stroke-linecap: round; }
      .outline { fill: none; stroke: #21313B; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .detail { fill: none; stroke: #176B87; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .force { fill: none; stroke: #F26B38; stroke-width: 8; stroke-linecap: round; marker-end: url(#arrow-orange); }
      .motion { fill: none; stroke: #176B87; stroke-width: 5; stroke-linecap: round; marker-end: url(#arrow-blue); }
      .leader { fill: none; stroke: #5B6970; stroke-width: 2.5; stroke-dasharray: 6 6; }
      .example-line { fill: none; stroke: #21313B; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
      .example-fill { fill: #DCE3E6; stroke: #21313B; stroke-width: 4; stroke-linejoin: round; }
      .accent-fill { fill: #F26B38; stroke: #21313B; stroke-width: 3; }
      * { vector-effect: non-scaling-stroke; }
    </style>
  </defs>

  <rect width="1800" height="860" fill="#F4F7F8"/>

  <!-- Panel 1: Tension -->
  <g transform="translate(28 28)">
    <rect class="panel" width="332" height="776" rx="24"/>
    <path class="panel-band" d="M 24 0 H 308 Q 332 0 332 24 V 92 H 0 V 24 Q 0 0 24 0 Z"/>
    <text class="heading" x="166" y="58">Tension</text>

    <text class="action" x="166" y="133">PULL APART</text>
    <rect class="part" x="86" y="230" width="160" height="62" rx="10"/>
    <line class="force" x1="86" y1="261" x2="32" y2="261"/>
    <line class="force" x1="246" y1="261" x2="300" y2="261"/>
    <line class="detail" x1="112" y1="247" x2="100" y2="261"/>
    <line class="detail" x1="112" y1="275" x2="100" y2="261"/>
    <line class="detail" x1="220" y1="247" x2="232" y2="261"/>
    <line class="detail" x1="220" y1="275" x2="232" y2="261"/>
    <text class="subhead" x="166" y="355">The part stretches</text>

    <line x1="38" y1="426" x2="294" y2="426" stroke="#D7DEE2" stroke-width="2"/>
    <text class="small" x="24" y="462">Everyday example</text>
    <!-- Rope -->
    <path class="example-line" d="M 62 583 C 86 558, 108 608, 132 583 S 178 558, 202 583 S 248 608, 272 583"/>
    <path class="outline" d="M 62 583 l -20 -14 m 20 14 l -20 0 m 20 0 l -18 15"/>
    <path class="outline" d="M 272 583 l 20 -14 m -20 14 l 20 0 m -20 0 l 18 15"/>
    <text class="subhead" x="166" y="674">Rope</text>
  </g>

  <!-- Panel 2: Compression -->
  <g transform="translate(381 28)">
    <rect class="panel" width="332" height="776" rx="24"/>
    <path class="panel-band" d="M 24 0 H 308 Q 332 0 332 24 V 92 H 0 V 24 Q 0 0 24 0 Z"/>
    <text class="heading" x="166" y="58">Compression</text>

    <text class="action" x="166" y="133">SQUEEZE</text>
    <rect class="part" x="86" y="230" width="160" height="62" rx="10"/>
    <line class="force" x1="30" y1="261" x2="82" y2="261"/>
    <line class="force" x1="302" y1="261" x2="250" y2="261"/>
    <rect x="118" y="237" width="96" height="48" rx="5" fill="url(#compression-hatch)" opacity="0.9"/>
    <text class="subhead" x="166" y="355">The part squashes</text>

    <line x1="38" y1="426" x2="294" y2="426" stroke="#D7DEE2" stroke-width="2"/>
    <text class="small" x="24" y="462">Everyday example</text>
    <!-- Chair leg -->
    <rect class="example-fill" x="88" y="523" width="156" height="32" rx="7"/>
    <path class="example-fill" d="M 140 555 H 192 L 184 642 H 148 Z"/>
    <line class="force" x1="166" y1="490" x2="166" y2="518"/>
    <line class="outline" x1="110" y1="646" x2="222" y2="646"/>
    <text class="subhead" x="166" y="692">Chair leg</text>
  </g>

  <!-- Panel 3: Bending -->
  <g transform="translate(734 28)">
    <rect class="panel" width="332" height="776" rx="24"/>
    <path class="panel-band" d="M 24 0 H 308 Q 332 0 332 24 V 92 H 0 V 24 Q 0 0 24 0 Z"/>
    <text class="heading" x="166" y="58">Bending</text>

    <text class="action" x="166" y="133">BOW</text>
    <path class="part" d="M 58 221 Q 166 315 274 221 L 286 249 Q 166 360 46 249 Z"/>
    <line class="force" x1="166" y1="158" x2="166" y2="222"/>
    <path d="M 77 235 Q 166 303 255 235" fill="none" stroke="#F26B38" stroke-width="7" stroke-dasharray="14 8"/>
    <path d="M 63 258 Q 166 345 269 258" fill="none" stroke="#176B87" stroke-width="5"/>
    <text class="small" x="18" y="343">Top squeezed</text>
    <path class="leader" d="M 114 337 L 148 290"/>
    <text class="small" x="174" y="385">Bottom stretched</text>
    <path class="leader" d="M 191 369 L 175 332"/>

    <line x1="38" y1="426" x2="294" y2="426" stroke="#D7DEE2" stroke-width="2"/>
    <text class="small" x="24" y="462">Everyday example</text>
    <!-- Ruler over two supports -->
    <path d="M 70 550 Q 166 622 262 550 L 268 567 Q 166 649 64 567 Z" fill="#F2C94C" stroke="#21313B" stroke-width="4"/>
    <line class="detail" x1="96" y1="574" x2="102" y2="587"/>
    <line class="detail" x1="126" y1="592" x2="132" y2="607"/>
    <line class="detail" x1="200" y1="592" x2="194" y2="607"/>
    <line class="detail" x1="230" y1="574" x2="224" y2="587"/>
    <path class="example-fill" d="M 54 578 l -18 46 h 42 z"/>
    <path class="example-fill" d="M 278 578 l -18 46 h 42 z"/>
    <text class="subhead" x="166" y="692">Ruler</text>
  </g>

  <!-- Panel 4: Shear -->
  <g transform="translate(1087 28)">
    <rect class="panel" width="332" height="776" rx="24"/>
    <path class="panel-band" d="M 24 0 H 308 Q 332 0 332 24 V 92 H 0 V 24 Q 0 0 24 0 Z"/>
    <text class="heading" x="166" y="58">Shear</text>

    <text class="action" x="166" y="133">SLIDE PAST</text>
    <path class="part" d="M 68 220 H 166 L 148 292 H 68 Z"/>
    <path class="part" d="M 166 220 H 264 V 292 H 148 Z"/>
    <line x1="166" y1="214" x2="148" y2="298" stroke="#A83C18" stroke-width="4" stroke-dasharray="8 6"/>
    <line class="force" x1="105" y1="302" x2="105" y2="352"/>
    <line class="force" x1="225" y1="210" x2="225" y2="160"/>
    <text class="subhead" x="166" y="390">Layers try to slide</text>

    <line x1="38" y1="426" x2="294" y2="426" stroke="#D7DEE2" stroke-width="2"/>
    <text class="small" x="24" y="462">Everyday example</text>
    <!-- Scissors -->
    <path d="M 157 582 L 276 524 L 173 598 Z" fill="#DCE3E6" stroke="#21313B" stroke-width="4"/>
    <path d="M 159 590 L 272 642 L 171 574 Z" fill="#DCE3E6" stroke="#21313B" stroke-width="4"/>
    <circle cx="153" cy="586" r="13" fill="#F26B38" stroke="#21313B" stroke-width="4"/>
    <circle cx="99" cy="548" r="31" fill="none" stroke="#176B87" stroke-width="12"/>
    <circle cx="99" cy="628" r="31" fill="none" stroke="#176B87" stroke-width="12"/>
    <line class="example-line" x1="122" y1="566" x2="145" y2="581"/>
    <line class="example-line" x1="123" y1="612" x2="145" y2="593"/>
    <text class="subhead" x="166" y="692">Scissors</text>
  </g>

  <!-- Panel 5: Torsion -->
  <g transform="translate(1440 28)">
    <rect class="panel" width="332" height="776" rx="24"/>
    <path class="panel-band" d="M 24 0 H 308 Q 332 0 332 24 V 92 H 0 V 24 Q 0 0 24 0 Z"/>
    <text class="heading" x="166" y="58">Torsion</text>

    <text class="action" x="166" y="133">TWIST</text>
    <rect class="part" x="72" y="230" width="188" height="62" rx="9"/>
    <path class="detail" d="M 96 233 L 126 289 M 132 233 L 162 289 M 168 233 L 198 289 M 204 233 L 234 289"/>
    <path class="force" d="M 77 329 C 24 319, 24 213, 77 198"/>
    <path class="force" d="M 255 198 C 308 213, 308 319, 255 329"/>
    <text class="subhead" x="166" y="390">The ends rotate</text>

    <line x1="38" y1="426" x2="294" y2="426" stroke="#D7DEE2" stroke-width="2"/>
    <text class="small" x="24" y="462">Everyday example</text>
    <!-- Twisted towel -->
    <path d="M 64 546 C 106 526, 114 610, 166 584 C 218 558, 228 642, 272 615 L 258 654 C 218 670, 208 592, 166 619 C 114 652, 104 567, 74 588 Z" fill="#72B7CC" stroke="#21313B" stroke-width="4"/>
    <path class="detail" d="M 90 557 C 116 558, 116 615, 146 615 M 186 586 C 214 584, 218 630, 249 634"/>
    <path class="outline" d="M 63 548 l -19 -13 m 21 22 l -24 0 m 27 11 l -20 14"/>
    <path class="outline" d="M 272 615 l 20 -14 m -17 23 l 24 1 m -27 10 l 20 15"/>
    <text class="subhead" x="166" y="692">Towel</text>
  </g>

  <text x="900" y="838" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#173E4E">Most real parts carry a mixture of these loads.</text>
</svg>
